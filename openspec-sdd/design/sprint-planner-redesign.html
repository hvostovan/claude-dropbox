<title>Sprint Planner</title>
<style>
  /* Committed to Private Banking's own dark/terracotta identity — not a
     light/dark toggle, this is the brand, so no prefers-color-scheme swap. */
  :root {
    color-scheme: dark;
    --paper: #141210;
    --surface: #1d1a16;
    --surface-soft: #241f19;
    --ink: #f3efe7;
    --ink-soft: #b6ac9c;
    --ink-faint: #7c7364;
    --line: #3a3226;
    --line-soft: #2b271f;

    --accent: #cb8c5e;
    --accent-contrast: #171310;
    --accent-ink: #2a2018;
    --chip-ink: #171310;

    --danger: #c1573f;
    --danger-ink: #2c1b16;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.55);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.4), 0 16px 32px -16px rgba(0, 0, 0, 0.65);

    --epic-1: #cb8c5e; --epic-1-ink: #2a2018; /* terracotta */
    --epic-2: #b99a5b; --epic-2-ink: #29241a; /* ochre */
    --epic-3: #8291a0; --epic-3-ink: #1e2327; /* slate */
    --epic-4: #a66e66; --epic-4-ink: #271a17; /* dusty wine */
    --epic-5: #8b9678; --epic-5-ink: #22241b; /* sage */

    --font-ui: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-ink); color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 24px 56px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 2px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .squirrel { width: 32px; height: 32px; color: var(--accent); flex: none; }
  .squirrel .tail { transform-origin: 30px 22px; animation: tail-sway 3.6s ease-in-out infinite; }
  @keyframes tail-sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-7deg); }
  }
  .brand-text { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .brand-name {
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .brand-sub {
    color: var(--ink-faint);
    font-size: 0.82rem;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-label-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 0.83rem;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .icon-label-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .icon-label-btn svg { width: 15px; height: 15px; }
  .gear-btn {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .gear-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .gear-btn:active { transform: scale(0.94); }
  .gear-btn svg { width: 18px; height: 18px; }

  /* ---------- Epic rail ---------- */
  .epic-rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 3px 2px 9px;
    scrollbar-width: thin;
  }
  .epic-rail:empty::after {
    content: "Эпиков пока нет — добавьте в настройках (значок шестерёнки)";
    color: var(--ink-faint);
    font-size: 0.85rem;
    padding: 8px 2px;
  }
  .epic-chip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-weight: 550;
    font-size: 0.88rem;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .epic-chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .epic-chip .dot {
    width: 9px; height: 9px; border-radius: 3px; flex: none;
    background: var(--dot-color, var(--ink-faint));
  }
  .epic-chip[aria-pressed="true"] {
    background: var(--dot-color, var(--accent));
    border-color: transparent;
    color: var(--chip-ink);
    box-shadow: var(--shadow-lift);
    transform: translateY(-1px);
  }
  .epic-chip[aria-pressed="true"] .dot { background: var(--chip-ink); opacity: 0.55; }

  /* ---------- Layout: two frames ---------- */
  .board-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .board-layout { grid-template-columns: 1fr; }
  }

  .capture-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .capture-card h2 {
    margin: 0;
    font-size: 1.0rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .capture-epic {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    align-self: flex-start;
    padding: 5px 10px 5px 8px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--tag-bg, var(--surface-soft));
    color: var(--tag-fg, var(--ink-soft));
  }
  .capture-epic .dot { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .capture-epic.is-empty { background: var(--danger-ink); color: var(--danger); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
  textarea, select, input[type="text"] {
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 9px 11px;
    color: var(--ink);
    resize: vertical;
  }
  textarea:focus, select:focus, input[type="text"]:focus { border-color: var(--accent); }
  textarea::placeholder, input::placeholder { color: var(--ink-faint); }

  .btn {
    border-radius: 7px;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 0.9rem;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease, background 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-ghost { background: var(--surface-soft); color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--ink-faint); }

  /* ---------- Board (right frame) — one continuous, copy-friendly list ---------- */
  .board-sheet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .board-toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .board-toolbar h2 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 650;
  }
  .board-toolbar .total {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    font-weight: 400;
    margin-left: 6px;
  }
  .copy-btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-soft);
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .copy-btn svg { width: 13px; height: 13px; }

  .board-list { padding: 4px 16px 14px; }
  .board-list:empty::after {
    content: "Пока нет задач — заполните форму слева.";
    display: block;
    color: var(--ink-faint);
    font-size: 0.9rem;
    padding: 16px 0 8px;
  }
  .epic-group-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 0 6px;
  }
  .epic-group-head .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--dot-color, var(--ink-faint)); align-self: center; }
  .epic-group-head h3 {
    margin: 0;
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dot-color, var(--ink-soft));
  }
  .epic-group-head .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.74rem;
    color: var(--ink-faint);
  }
  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid var(--line-soft);
  }
  .task-row:last-child { border-bottom: none; }
  .avatar {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 0.68rem;
    font-weight: 700;
    background: var(--surface-soft);
    color: var(--ink-soft);
    user-select: none;
  }
  .task-line { flex: 1; min-width: 0; font-size: 0.92rem; word-wrap: break-word; padding-top: 2px; }
  .task-assignee { color: var(--ink-faint); }
  .task-remove {
    flex: none;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    opacity: 0;
    user-select: none;
    transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .task-row:hover .task-remove,
  .task-row:focus-within .task-remove { opacity: 1; }
  .task-remove:hover { background: var(--danger-ink); color: var(--danger); }
  .task-remove:focus-visible { opacity: 1; }

  /* ---------- Settings drawer ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(1px);
    z-index: 20;
  }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(380px, 92vw);
    background: var(--paper);
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lift);
    z-index: 21;
    display: flex;
    flex-direction: column;
    padding: 18px 18px 24px;
    gap: 22px;
    overflow-y: auto;
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h2 { margin: 0; font-size: 1.0rem; font-weight: 650; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); }

  .drawer-section { display: flex; flex-direction: column; gap: 10px; }
  .drawer-section h3 {
    margin: 0;
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .manage-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .manage-row {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 8px 7px 10px;
  }
  .manage-row .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--dot-color, var(--ink-faint)); }
  .manage-row .avatar { width: 22px; height: 22px; font-size: 0.65rem; }
  .manage-row input[type="text"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    padding: 3px 2px;
  }
  .manage-row input[type="text"]:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .row-delete {
    flex: none;
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .row-delete:hover { background: var(--danger-ink); }
  .manage-list:empty::after {
    content: "Пусто.";
    color: var(--ink-faint);
    font-size: 0.85rem;
  }
  .add-row { display: flex; gap: 7px; }
  .add-row input { flex: 1; min-width: 0; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation: none !important; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="squirrel" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="21" cy="30.5" rx="8.5" ry="7.5"/>
        <circle cx="14.5" cy="20" r="6"/>
        <path d="M11.5 15.2c-.6-1.8-.3-3 .6-3.6.7 1 .9 2.2.6 3.4"/>
        <circle cx="12.6" cy="19.3" r="0.9" fill="currentColor" stroke="none"/>
        <g class="tail">
          <path d="M27 32c9-1 13.5-11 6.5-18 5 5 4.5 12-2 14"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Sprint Planner</span>
        <span class="brand-sub">— общий список задач команды</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-label-btn" id="exportBtn" title="Скачать все данные файлом .json">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Выгрузить JSON
      </button>
      <button class="gear-btn" id="settingsBtn" aria-haspopup="dialog" aria-controls="settingsDrawer" title="Настройки: эпики и сотрудники">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.65 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.65a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="epic-rail" id="epicRail" aria-label="Выбор эпика"></nav>

  <main class="board-layout">
    <section class="capture-card" aria-labelledby="captureTitle">
      <h2 id="captureTitle">Новая задача</h2>
      <div class="capture-epic" id="captureEpicTag"></div>
      <label class="field">
        <span class="field-label">Текст задачи</span>
        <textarea id="taskText" rows="4" placeholder="Например: обновить лендинг"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Исполнитель</span>
        <select id="taskAssignee"></select>
      </label>
      <button class="btn btn-primary" id="addTaskBtn">Добавить задачу</button>
    </section>

    <section class="board-sheet" aria-label="Список задач по эпикам">
      <div class="board-toolbar">
        <h2>Список задач<span class="total" id="taskTotal"></span></h2>
        <button class="copy-btn" id="copyListBtn" title="Скопировать список задач текстом">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span id="copyBtnLabel">Скопировать</span>
        </button>
      </div>
      <div class="board-list" id="board"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <h2 id="drawerTitle">Настройки</h2>
    <button class="icon-btn" id="closeDrawer" aria-label="Закрыть настройки">✕</button>
  </div>

  <section class="drawer-section" aria-labelledby="epicsHeading">
    <h3 id="epicsHeading">Эпики</h3>
    <ul class="manage-list" id="epicManageList"></ul>
    <form class="add-row" id="addEpicForm">
      <input type="text" id="newEpicName" placeholder="Новый эпик" required>
      <button class="btn btn-ghost" type="submit">Добавить</button>
    </form>
  </section>

  <section class="drawer-section" aria-labelledby="peopleHeading">
    <h3 id="peopleHeading">Сотрудники</h3>
    <ul class="manage-list" id="peopleManageList"></ul>
    <form class="add-row" id="addPersonForm">
      <input type="text" id="newPersonName" placeholder="Имя сотрудника" required>
      <button class="btn btn-ghost" type="submit">Добавить</button>
    </form>
  </section>
</aside>

<script>
  const EPIC_COLORS = ['epic-1', 'epic-2', 'epic-3', 'epic-4', 'epic-5'];
  let uidSeed = 0;
  const uid = () => 'id' + (++uidSeed);

  const state = {
    epics: [
      { id: uid(), name: 'Космос', color: 'epic-1' },
      { id: uid(), name: 'Ретро сайта', color: 'epic-2' },
      { id: uid(), name: 'Инфраструктура', color: 'epic-3' },
    ],
    people: [],
    tasks: [],
    selectedEpicId: null,
  };
  // seed people
  ['Женя', 'Павел', 'Юра', 'Илья', 'Настя'].forEach(n => state.people.push({ id: uid(), name: n }));
  state.selectedEpicId = state.epics[0].id;
  // seed tasks
  const byName = n => state.people.find(p => p.name === n).id;
  const epicId = i => state.epics[i].id;
  state.tasks.push(
    { id: uid(), text: 'Придумать план для счастья', assigneeId: byName('Женя'), epicId: epicId(0) },
    { id: uid(), text: 'Собрать референсы миссий', assigneeId: byName('Павел'), epicId: epicId(0) },
    { id: uid(), text: 'Обновить лендинг', assigneeId: byName('Юра'), epicId: epicId(1) },
    { id: uid(), text: 'Настроить CI', assigneeId: byName('Илья'), epicId: epicId(2) },
  );

  const $ = sel => document.querySelector(sel);
  const epicRail = $('#epicRail');
  const captureEpicTag = $('#captureEpicTag');
  const taskText = $('#taskText');
  const taskAssignee = $('#taskAssignee');
  const addTaskBtn = $('#addTaskBtn');
  const board = $('#board');
  const taskTotal = $('#taskTotal');
  const epicManageList = $('#epicManageList');
  const peopleManageList = $('#peopleManageList');

  function nextEpicColor() {
    const used = state.epics.map(e => e.color);
    return EPIC_COLORS.find(c => !used.includes(c)) || EPIC_COLORS[state.epics.length % EPIC_COLORS.length];
  }
  function initials(name) {
    return name.trim().split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
  }
  function personName(id) {
    const p = state.people.find(p => p.id === id);
    return p ? p.name : '—';
  }
  function epicOf(id) { return state.epics.find(e => e.id === id); }

  function renderEpicRail() {
    epicRail.innerHTML = '';
    state.epics.forEach(epic => {
      const btn = document.createElement('button');
      btn.className = 'epic-chip';
      btn.type = 'button';
      btn.style.setProperty('--dot-color', `var(--${epic.color})`);
      btn.setAttribute('aria-pressed', String(epic.id === state.selectedEpicId));
      btn.innerHTML = `<span class="dot"></span>${escapeHtml(epic.name)}`;
      btn.addEventListener('click', () => {
        state.selectedEpicId = epic.id;
        renderEpicRail();
        renderCaptureEpic();
      });
      epicRail.appendChild(btn);
    });
  }

  function renderCaptureEpic() {
    const epic = epicOf(state.selectedEpicId);
    const hasEpics = state.epics.length > 0;
    addTaskBtn.disabled = !hasEpics;
    taskText.disabled = !hasEpics;
    taskAssignee.disabled = !hasEpics || state.people.length === 0;
    if (!hasEpics) {
      captureEpicTag.className = 'capture-epic is-empty';
      captureEpicTag.innerHTML = 'Сначала добавьте эпик в настройках';
      return;
    }
    captureEpicTag.className = 'capture-epic';
    captureEpicTag.style.setProperty('--tag-bg', `var(--${epic.color}-ink)`);
    captureEpicTag.style.setProperty('--tag-fg', `var(--${epic.color})`);
    captureEpicTag.innerHTML = `<span class="dot"></span>Эпик: ${escapeHtml(epic.name)}`;
  }

  function renderAssigneeOptions() {
    taskAssignee.innerHTML = '';
    if (state.people.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'Нет сотрудников — добавьте в настройках';
      taskAssignee.appendChild(opt);
      return;
    }
    state.people.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      taskAssignee.appendChild(opt);
    });
  }

  // Board renders as ONE continuous list (single sheet, hairline dividers,
  // no per-epic cards) so a person can select top-to-bottom and copy it out
  // as plain text — same as the "Скопировать" button below builds.
  function renderBoard() {
    board.innerHTML = '';
    let total = 0;

    function appendGroup(title, color, tasks) {
      if (tasks.length === 0) return;
      total += tasks.length;
      const head = document.createElement('div');
      head.className = 'epic-group-head';
      if (color) head.style.setProperty('--dot-color', `var(--${color})`);
      head.innerHTML = `<span class="dot"></span><h3>${escapeHtml(title)}</h3><span class="count">${tasks.length}</span>`;
      board.appendChild(head);
      tasks.forEach(t => board.appendChild(renderTaskRow(t)));
    }

    state.epics.forEach(epic => {
      appendGroup(epic.name, epic.color, state.tasks.filter(t => t.epicId === epic.id));
    });
    appendGroup('Без эпика', null, state.tasks.filter(t => !epicOf(t.epicId)));

    taskTotal.textContent = total ? ` (${total})` : '';
  }

  function renderTaskRow(t) {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <span class="avatar" aria-hidden="true">${escapeHtml(initials(personName(t.assigneeId)))}</span>
      <span class="task-line">${escapeHtml(t.text)} — <span class="task-assignee">${escapeHtml(personName(t.assigneeId))}</span></span>
      <button class="task-remove" title="Удалить задачу" aria-label="Удалить задачу">✕</button>
    `;
    row.querySelector('.task-remove').addEventListener('click', () => {
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      renderBoard();
    });
    return row;
  }

  function renderEpicManageList() {
    epicManageList.innerHTML = '';
    state.epics.forEach(epic => {
      const li = document.createElement('li');
      li.className = 'manage-row';
      li.style.setProperty('--dot-color', `var(--${epic.color})`);
      li.innerHTML = `
        <span class="dot"></span>
        <input type="text" value="${escapeAttr(epic.name)}" aria-label="Название эпика">
        <button class="row-delete" type="button">Удалить</button>
      `;
      const input = li.querySelector('input');
      input.addEventListener('change', () => {
        epic.name = input.value.trim() || epic.name;
        renderAll();
      });
      li.querySelector('.row-delete').addEventListener('click', () => {
        state.epics = state.epics.filter(e => e.id !== epic.id);
        state.tasks.forEach(t => { if (t.epicId === epic.id) t.epicId = null; });
        if (state.selectedEpicId === epic.id) {
          state.selectedEpicId = state.epics[0] ? state.epics[0].id : null;
        }
        renderAll();
      });
      epicManageList.appendChild(li);
    });
  }

  function renderPeopleManageList() {
    peopleManageList.innerHTML = '';
    state.people.forEach(person => {
      const li = document.createElement('li');
      li.className = 'manage-row';
      li.innerHTML = `
        <span class="avatar">${escapeHtml(initials(person.name))}</span>
        <input type="text" value="${escapeAttr(person.name)}" aria-label="Имя сотрудника">
        <button class="row-delete" type="button">Удалить</button>
      `;
      const input = li.querySelector('input');
      input.addEventListener('change', () => {
        person.name = input.value.trim() || person.name;
        renderAll();
      });
      li.querySelector('.row-delete').addEventListener('click', () => {
        state.people = state.people.filter(p => p.id !== person.id);
        renderAll();
      });
      peopleManageList.appendChild(li);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  function renderAll() {
    renderEpicRail();
    renderCaptureEpic();
    renderAssigneeOptions();
    renderBoard();
    renderEpicManageList();
    renderPeopleManageList();
  }

  addTaskBtn.addEventListener('click', () => {
    const text = taskText.value.trim();
    if (!text || !state.selectedEpicId || state.people.length === 0) return;
    state.tasks.push({
      id: uid(),
      text,
      assigneeId: taskAssignee.value,
      epicId: state.selectedEpicId,
    });
    taskText.value = '';
    taskText.focus();
    renderBoard();
  });

  const addEpicForm = $('#addEpicForm');
  addEpicForm.addEventListener('submit', e => {
    e.preventDefault();
    const input = $('#newEpicName');
    const name = input.value.trim();
    if (!name) return;
    const epic = { id: uid(), name, color: nextEpicColor() };
    state.epics.push(epic);
    if (!state.selectedEpicId) state.selectedEpicId = epic.id;
    input.value = '';
    renderAll();
  });

  const addPersonForm = $('#addPersonForm');
  addPersonForm.addEventListener('submit', e => {
    e.preventDefault();
    const input = $('#newPersonName');
    const name = input.value.trim();
    if (!name) return;
    state.people.push({ id: uid(), name });
    input.value = '';
    renderAll();
  });

  // ---- copy the whole grouped list as plain text ----
  function buildListText() {
    const lines = [];
    function group(title, tasks) {
      if (!tasks.length) return;
      lines.push(`Эпик: ${title}`);
      tasks.forEach(t => lines.push(`- ${t.text} — ${personName(t.assigneeId)}`));
      lines.push('');
    }
    state.epics.forEach(epic => group(epic.name, state.tasks.filter(t => t.epicId === epic.id)));
    group('Без эпика', state.tasks.filter(t => !epicOf(t.epicId)));
    return lines.join('\n').trim();
  }
  const copyListBtn = $('#copyListBtn');
  const copyBtnLabel = $('#copyBtnLabel');
  copyListBtn.addEventListener('click', async () => {
    const text = buildListText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* no-op */ }
      ta.remove();
    }
    const prev = copyBtnLabel.textContent;
    copyBtnLabel.textContent = 'Скопировано';
    setTimeout(() => { copyBtnLabel.textContent = prev; }, 1500);
  });

  // ---- export all data as a downloaded .json file ----
  $('#exportBtn').addEventListener('click', () => {
    const data = { epics: state.epics, people: state.people, tasks: state.tasks };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sprint-planner.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  // ---- settings drawer open/close ----
  const settingsBtn = $('#settingsBtn');
  const settingsDrawer = $('#settingsDrawer');
  const scrim = $('#scrim');
  const closeDrawer = $('#closeDrawer');
  function openDrawer() {
    settingsDrawer.hidden = false;
    scrim.hidden = false;
    closeDrawer.focus();
  }
  function hideDrawer() {
    settingsDrawer.hidden = true;
    scrim.hidden = true;
    settingsBtn.focus();
  }
  settingsBtn.addEventListener('click', openDrawer);
  closeDrawer.addEventListener('click', hideDrawer);
  scrim.addEventListener('click', hideDrawer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !settingsDrawer.hidden) hideDrawer();
  });

  renderAll();
</script>
